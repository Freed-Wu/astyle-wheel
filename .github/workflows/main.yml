---
"on":
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:
  workflow_call:

# https://github.com/softprops/action-gh-release/issues/236
permissions:
  contents: write
  id-token: write

jobs:
  build-wheels-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            CIBW_BUILD: "*-musllinux_*"
            suffix: -musllinux
          - runs-on: ubuntu-latest
            CIBW_BUILD: "*-manylinux_*"
            suffix: -manylinux
          - runs-on: macos-latest
            CIBW_BUILD: "*"
          - runs-on: windows-latest
            CIBW_BUILD: "*"
    runs-on: ${{matrix.runs-on}}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: runner.os == 'Linux'
      - uses: pypa/cibuildwheel@v4.2
        with:
          package-dir: packages/astyle
        env:
          CIBW_BUILD: cp314${{matrix.CIBW_BUILD}}
      - uses: pypa/cibuildwheel@v4.2
        with:
          package-dir: packages/mdformat-astyle
        env:
          CIBW_BUILD: ${{matrix.CIBW_BUILD}}
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{matrix.runs-on}}${{matrix.suffix}}
          path: |
            wheelhouse/*

  build:
    needs:
      - build-wheels-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Build sdist
        run: |
          uv build --package=astyle --sdist
          uv build --package=mdformat-astyle --sdist
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # body_path: build/CHANGELOG.md
          files: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          password: ${{secrets.PYPI_API_TOKEN}}
