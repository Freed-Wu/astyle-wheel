# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
[project]
name = "mdformat-astyle"
version = "3.6.18"
description = "Artistic Style is a source code indenter, formatter, and beautifier for the C, C++, C++/CLI, Objective‑C, C# and Java programming languages"
readme = "README.md"
requires-python = ">= 3.8"
license = "GPL-3.0-or-later"
keywords = ["formatter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Software Development :: Build Tools",
]

[[project.authors]]
name = "Andre Simon"
email = "as@andre-simon.de"

[[project.authors]]
name = "Jim Pattee"

[[project.authors]]
name = "Tal Davidson"

[project.urls]
"Bug Report" = "https://github.com/Freed-Wu/astyle-wheel/issues"
Download = "https://github.com/Freed-Wu/astyle-wheel/releases"
Homepage = "http://astyle.sourceforge.net"
Source = "https://github.com/Freed-Wu/astyle-wheel"

[project.entry-points."mdformat.codeformatter"]
c = "astyle.mdformat:mdformat"
cpp = "astyle.mdformat:mdformat"
java = "astyle.mdformat:mdformat"
cs = "astyle.mdformat:mdformat"

[project.optional-dependencies]
dev = ["pytest-cov"]

[build-system]
requires = ["autopxd2", "cython-cmake", "scikit-build-core"]
build-backend = "scikit_build_core.build"

[tool.cibuildwheel]
archs = ["all"]
# FileNotFoundError: Unable to find library: msvcp140.dll
skip = "*38-* *39-* *310-* *-win_arm64"
build-frontend = "build[uv]"
before-test = "pip install packages/mdformat-astyle[dev]"
test-command = "pytest {project}/packages/mdformat-astyle"
# pip: command not found
test-skip = "*-macosx_*"

[tool.cibuildwheel.environment]
# error: 'path' is unavailable: introduced in macOS 10.15
MACOSX_DEPLOYMENT_TARGET = "10.15"

# AssertionError: uv not found
[[tool.cibuildwheel.overrides]]
select = ["*-win*"]
before-all = "pip install uv"

[[tool.cibuildwheel.overrides]]
select = ["*-macosx_*"]
before-all = "brew install uv"

# https://github.com/astral-sh/uv/issues/10260
[[tool.cibuildwheel.overrides]]
select = ["*-musllinux_s390x", "*-musllinux_ppc64*"]
build-frontend = "build"
